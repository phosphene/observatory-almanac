name: Deploy MkDocs to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # fetch-depth: 0 is required for git-revision-date-localized-plugin.
          # Without full history, the plugin raises GitCommandError on files
          # that have no reachable commit. fallback_to_build_date: true in
          # mkdocs.yml provides a safety net if this ever changes, but we
          # keep full history to ensure accurate dates.
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements-docs.txt
            lib/python/almanac/pyproject.toml

      - name: Install docs dependencies
        run: pip install -r requirements-docs.txt

      - name: Install almanac Python lib
        # hatchling is the build backend declared in lib/python/almanac/pyproject.toml.
        # It must be installed before pip can resolve the editable install.
        run: |
          pip install hatchling
          pip install -e lib/python/almanac

      - name: Generate area indexes
        # Writes areas/<area>/index.md for each area directory.
        # Must run before MkDocs build so nav pages are present.
        run: almanac-indexer --root .

      - name: Build docs symlink tree
        # Rebuilds docs/areas/<area>/ symlinks and .pages nav files.
        # Required after any area content changes.
        run: almanac-tree --root .

      - name: Validate content
        # Run validator and emit a YAML violation report to stdout.
        # continue-on-error: true — violations are surfaced in CI logs
        # but do not block the deploy. Promote to continue-on-error: false
        # when the content is stable enough to enforce as a gate.
        run: python -m almanac.validator --root .
        continue-on-error: true

      - name: Build MkDocs site
        # --strict temporarily disabled while broken author links are fixed.
        # Re-enable after links in authors/ are corrected.
        run: mkdocs build

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: site/

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

  verify:
    needs: deploy
    runs-on: ubuntu-latest
    steps:
      - name: Wait for CDN propagation
        # GitHub Pages can take 15-30s to serve fresh content after deploy.
        run: sleep 30

      - name: Checkout (for area list)
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Verify homepage loads and contains expected content
        run: |
          echo "Checking homepage..."
          BODY=$(curl -sf --max-time 15 "https://phosphene.github.io/observatory-almanac/")
          echo "$BODY" | grep -q "Observatory Almanac" || (echo "FAIL: homepage missing title" && exit 1)
          echo "$BODY" | grep -q "areas" || (echo "FAIL: homepage missing areas section" && exit 1)
          echo "✓ Homepage OK"

      - name: Verify all deployed area pages return 200
        # Discovers area slugs from the areas/ directory in the repo,
        # then checks each live URL. Fails the workflow if any area 404s.
        run: |
          SITE="https://phosphene.github.io/observatory-almanac"
          FAILED=0
          for dir in areas/*/; do
            area=$(basename "$dir")
            URL="$SITE/areas/$area/"
            STATUS=$(curl -o /dev/null -s -w "%{http_code}" --max-time 15 "$URL")
            if [ "$STATUS" = "200" ]; then
              echo "✓ $area ($STATUS)"
            else
              echo "✗ FAIL: $area returned HTTP $STATUS — $URL"
              FAILED=1
            fi
          done
          if [ $FAILED -ne 0 ]; then
            echo ""
            echo "One or more area pages failed the post-deploy check."
            exit 1
          fi
          echo ""
          echo "All area pages verified."

      - name: Verify SCHEMA page loads
        run: |
          STATUS=$(curl -o /dev/null -s -w "%{http_code}" --max-time 15 \
            "https://phosphene.github.io/observatory-almanac/SCHEMA/")
          [ "$STATUS" = "200" ] || (echo "FAIL: SCHEMA page returned $STATUS" && exit 1)
          echo "✓ SCHEMA page OK"
