name: Deploy MkDocs to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # required for git-revision-date plugin

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install MkDocs dependencies
        run: pip install -r requirements-docs.txt

      - name: Install almanac Python lib
        run: pip install -e lib/python/almanac

      - name: Generate area indexes
        run: python scripts/generate_area_indexes.py

      - name: Validate content
        run: |
          cd lib/python
          pip install pytest ruamel-yaml pydantic pyyaml
          python -m almanac.validator --root ../..
        continue-on-error: true   # report violations but don't block deploy

      - name: Build MkDocs site
        run: mkdocs build --strict

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: site/

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
