[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "almanac"
version = "0.1.0"
description = "Observatory Almanac — schema validation, indexing, and MkDocs tooling"
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.7",
    "ruamel.yaml>=0.18",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.4",
    "behave>=1.2.6",
]

[project.scripts]
almanac-validator = "almanac.cli:validator_main"
almanac-indexer = "almanac.cli:indexer_main"
almanac-tree = "almanac.cli:tree_main"

[tool.hatch.build.targets.wheel]
packages = ["src/almanac"]
