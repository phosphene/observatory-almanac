site_name: "Observatory Almanac"
site_description: "Expert-authored knowledge across 26 subject areas — science, history, environment, philosophy, cooking, health, and more."
site_url: "https://ind-media.github.io/observatory-almanac"
repo_url: "https://github.com/ind-media/observatory-almanac"
repo_name: "ind-media/observatory-almanac"
docs_dir: "."
site_dir: "site"
edit_uri: "edit/main/"

# ---------------------------------------------------------------------------
# Theme
# ---------------------------------------------------------------------------
theme:
  name: material
  palette:
    - scheme: default
      primary: teal
      accent: amber
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - scheme: slate
      primary: teal
      accent: amber
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
  features:
    - navigation.tabs
    - navigation.tabs.sticky
    - navigation.sections
    - navigation.indexes
    - navigation.top
    - navigation.instant
    - navigation.instant.progress
    - search.suggest
    - search.highlight
    - search.share
    - content.tabs.link
    - content.code.copy
    - toc.follow
  font:
    text: Source Sans 3
    code: JetBrains Mono
  icon:
    logo: material/book-open-variant
    repo: fontawesome/brands/github

# ---------------------------------------------------------------------------
# Plugins
# ---------------------------------------------------------------------------
plugins:
  - search:
      lang: en
      separator: '[\s\-,:!=\[\]()"/]+|(?!\b)(?=[A-Z][a-z])'
  - tags:
      tags_file: meta/tags.md
  - git-revision-dates-localized:
      enable_creation_date: true
      type: date
      fallback_to_build_date: true

# ---------------------------------------------------------------------------
# Markdown extensions
# ---------------------------------------------------------------------------
markdown_extensions:
  - tables
  - admonition
  - pymdownx.details
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.highlight:
      anchor_linenums: true
      line_spans: __span
      pygments_lang_class: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
  - attr_list
  - md_in_html
  - footnotes
  - toc:
      permalink: true
      permalink_title: Link to this section
      toc_depth: 3

# ---------------------------------------------------------------------------
# Extra
# ---------------------------------------------------------------------------
extra:
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/ind-media/observatory-almanac
    - icon: fontawesome/solid/globe
      link: https://observatory.wiki
  generator: false

extra_css:
  - docs/assets/almanac.css

# ---------------------------------------------------------------------------
# Exclude non-content paths from the docs tree
# ---------------------------------------------------------------------------
exclude_docs: |
  lib/
  scripts/
  site/
  .git/
  .github/
  node_modules/
  AUTHORS.md
  CHANGELOG.md
  meta/CONTEXT_INDEX.md
  *.toml
  *.lock
  *.yml
  *.yaml
  *.json
  *.zip
  *.sh

# ---------------------------------------------------------------------------
# Navigation
# ---------------------------------------------------------------------------
nav:
  - Home: docs/index.md

  - Science:
    - areas/science/index.md
    - articles: areas/science/

  - Environment:
    - areas/environment/index.md
    - articles: areas/environment/

  - History:
    - areas/history/index.md
    - articles: areas/history/

  - Economy:
    - areas/economy/index.md
    - articles: areas/economy/

  - Animals:
    - areas/animals/index.md
    - articles: areas/animals/

  - Health:
    - areas/health/index.md
    - articles: areas/health/

  - Cooking:
    - areas/cooking/index.md
    - articles: areas/cooking/

  - Philosophy:
    - areas/philosophy/index.md
    - articles: areas/philosophy/

  - Psychology:
    - areas/psychology/index.md
    - articles: areas/psychology/

  - Arts & Recreation:
    - areas/arts-recreation/index.md
    - articles: areas/arts-recreation/

  - World Affairs:
    - areas/world-affairs/index.md
    - articles: areas/world-affairs/

  - Technology:
    - areas/technology/index.md
    - articles: areas/technology/

  - Language:
    - areas/language/index.md
    - articles: areas/language/

  - Local Peace Economy:
    - areas/local-peace-economy/index.md
    - articles: areas/local-peace-economy/

  - Human Bridges:
    - areas/human-bridges/index.md
    - articles: areas/human-bridges/

  - Authors: authors/
  - Guides: guides/

  - Meta:
    - Schema: SCHEMA.md
    - Areas: AREAS.md
    - Tags: meta/tags.md
