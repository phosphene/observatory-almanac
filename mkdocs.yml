site_name: "Observatory Almanac"
site_description: "Expert-authored knowledge across 26 subject areas - science, history, environment, philosophy, cooking, health, and more."
site_url: "https://phosphene.github.io/observatory-almanac"
repo_url: "https://github.com/phosphene/observatory-almanac"
repo_name: "phosphene/observatory-almanac"
docs_dir: docs
site_dir: site
edit_uri: "edit/main/docs/"

# ---------------------------------------------------------------------------
# Theme
# ---------------------------------------------------------------------------
theme:
  name: material
  palette:
    - scheme: default
      primary: teal
      accent: amber
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - scheme: slate
      primary: teal
      accent: amber
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
  features:
    - navigation.tabs
    - navigation.tabs.sticky
    - navigation.sections
    - navigation.indexes
    - navigation.top
    - navigation.instant
    - navigation.instant.progress
    - search.suggest
    - search.highlight
    - search.share
    - content.tabs.link
    - content.code.copy
    - toc.follow
  font:
    text: Source Sans 3
    code: JetBrains Mono
  icon:
    logo: material/book-open-variant
    repo: fontawesome/brands/github

# ---------------------------------------------------------------------------
# Plugins
# ---------------------------------------------------------------------------
plugins:
  - search:
      lang: en
      separator: '[\s\-,:!=\[\]()"/]+|(?!\b)(?=[A-Z][a-z])'
  - tags: {}
  # - awesome-pages  # disabled: explicit nav in mkdocs.yml
  # git-revision-date-localized: shows "last updated" dates on pages.
  # fallback_to_build_date: true is REQUIRED - GitHub Actions performs a
  # shallow clone (fetch-depth: 0 is set in deploy.yml to work around this,
  # but if the CI config ever changes, without fallback the plugin raises
  # a GitCommandError on files with no reachable commit history and aborts
  # the build). Keep fallback enabled permanently.
  - git-revision-date-localized:
      enable_creation_date: true
      type: date
      fallback_to_build_date: true

# ---------------------------------------------------------------------------
# Markdown extensions
# ---------------------------------------------------------------------------
markdown_extensions:
  - tables
  - admonition
  - pymdownx.details
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.highlight:
      anchor_linenums: true
      line_spans: __span
      pygments_lang_class: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
  - attr_list
  - md_in_html
  - footnotes
  - toc:
      permalink: true
      permalink_title: Link to this section
      toc_depth: 3

